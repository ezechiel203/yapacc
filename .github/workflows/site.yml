name: Site

# Builds the website with `cargo xtask site` (output: target/site) and
# deploys it to GitHub Pages.
#
# It is started by hand (Actions > Site > Run workflow) and has never run.
# The site is published by `site/publish.sh`, which pushes the same files
# to the branch `gh-pages`; the Pages source is that branch.
#
# To publish from here instead: set Settings > Pages > Build and
# deployment > Source to "GitHub Actions" (until then the deploy job
# fails), and add a `push` trigger on `main` for `site/**`,
# `docs/handbook/**` and `crates/xtask/**`. Use one way or the other, not
# both.
#
# Every action is pinned to a commit; the comment beside it names the
# release.

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a run that is deploying is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (cargo xtask site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: site
      - name: cargo xtask site
        run: cargo run --locked --package xtask -- site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # publish the site
      id-token: write    # prove to Pages that the artifact comes from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
